<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Assignment & Important Dates Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Assignment & Important Dates Tracker</h1>
    <p class="subtitle">A calm, day‑by‑day planner</p>
  </header>

  <main class="container">
    <section class="controls">
      <div class="nav">
        <button id="prevMonth" aria-label="Previous month">&lt;</button>
        <h2 id="monthLabel" aria-live="polite"></h2>
        <button id="nextMonth" aria-label="Next month">&gt;</button>
      </div>
      <div class="actions">
        <button id="openAddModal" class="primary">Add Task</button>
        <input id="searchInput" placeholder="Search tasks..." aria-label="Search tasks">
      </div>
    </section>

    <section id="calendar" class="calendar" aria-label="Calendar"></section>
  </main>

  <!-- Task Modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Close">&times;</button>
      <h3 id="modalTitle">Add Task</h3>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <label>
          Name
          <input id="taskName" name="name" required maxlength="150" />
        </label>
        <label>
          Date
          <input id="taskDate" name="date" type="date" />
        </label>
        <label>
          Deadline (optional)
          <input id="taskDeadline" name="deadline" type="date" />
        </label>
        <label>
          Notes
          <textarea id="taskNotes" name="notes" rows="3"></textarea>
        </label>
        <div class="modal-actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="cancelModal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden></div>

  <script src="script.js"></script>
</body>
</html>
